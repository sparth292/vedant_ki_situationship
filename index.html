<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(-45deg, #ffb6c1, #ff69b4, #ffb6c1, #ff69b4);
      background-size: 400% 400%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
      position: relative;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    
    .floating-elements .element {
      position: absolute;
      pointer-events: none;
      animation: float-up linear infinite;
      opacity: 0.7;
    }
    
    .floating-elements .heart {
      color: #ff6b6b;
      font-size: 20px;
      animation-duration: 15s;
    }
    
    .floating-elements .rose {
      width: 25px;
      height: 25px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e84393"><path d="M12 2C8 7 4 10 4 14c0 3.3 2.7 6 6 6s6-2.7 6-6c0-4-4-7-8-12z"/></svg>') no-repeat center;
      background-size: contain;
      animation-duration: 20s;
    }
    
    .floating-elements .small-heart {
      color: #ff9e9e;
      font-size: 15px;
      animation-duration: 12s;
    }
    
    @keyframes float-up {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 250, 250, 0.95);
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      position: relative;
      z-index: 1;
      animation: cardAppear 1s ease-out;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,182,193,0.1) 0%, rgba(255,255,255,0) 70%);
      z-index: -1;
    }
    
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bear face */
    .bear {
      width: 120px;
      height: 120px;
      background: #f5caa5;
      border-radius: 50%;
      margin: 0 auto 25px;
      position: relative;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid #fff;
      background: linear-gradient(135deg, #f5caa5, #f0b88d);
    }
    
    .bear:hover {
      transform: scale(1.1) rotate(-5deg);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .bear::before,
    .bear::after {
      content: "";
      width: 16px;
      height: 16px;
      background: #ff6b8b;
      border-radius: 50%;
      position: absolute;
      top: 38px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border: 2px solid #fff;
    }

    .bear::before {
      left: 30px;
    }

    .bear::after {
      right: 30px;
    }
    
    /* Blush effect */
    .bear::before,
    .bear::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 8px;
      background: rgba(255, 150, 150, 0.3);
      border-radius: 50%;
      top: 70px;
      filter: blur(4px);
      font-size: 18px;
    }
    
    .bear::before {
      left: 25px;
    }
    
    .bear::after {
      right: 25px;
    }

    .nose {
      width: 12px;
      height: 10px;
      background: #ff6b8b;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border: 2px solid #fff;
    }
    
    /* Smile */
    .bear::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 15px;
      border-bottom: 3px solid #ff6b8b;
      border-radius: 0 0 50% 50%;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      animation: smile 3s ease-in-out infinite;
    }
    
    @keyframes smile {
      0%, 100% {
        width: 30px;
        height: 15px;
        border-radius: 0 0 50% 50%;
      }
      50% {
        width: 35px;
        height: 18px;
        border-radius: 0 0 60% 60%;
      }
    }

    .heart {
      position: absolute;
      right: -5px;
      top: -5px;
      font-size: 28px;
      color: #ff4d6d;
      text-shadow: 0 2px 10px rgba(255, 77, 109, 0.5);
      animation: heartbeat 1.5s ease-in-out infinite;
      transform-origin: center;
    }
    
    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }
      14% {
        transform: scale(1.2);
      }
      28% {
        transform: scale(1);
      }
      42% {
        transform: scale(1.2);
      }
      70% {
        transform: scale(1);
      }
    }

    h2 {
      font-size: 48px;
      margin: 30px 0 40px;
      color: #ff4d6d;
      font-family: 'Dancing Script', cursive;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0 10px;
    }

    button {
      padding: 15px 40px;
      border-radius: 50px;
      border: none;
      font-size: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .yes {
      background: #ff4d6d;
      color: #fff;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    
    .yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
    }
    
    .yes:active {
      transform: translateY(1px);
    }

    .no {
      background: #f8f9fa;
      color: #6c757d;
      position: relative;
      transition: all 0.3s ease;
    }
    
    .no:hover {
      background: #e9ecef;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 25px;
      font-size: 14px;
      color: #999;
      font-style: italic;
      letter-spacing: 0.5px;
      font-family: 'Poppins', sans-serif;
    }

    /* 📱 Mobile */
    @media (max-width: 768px) {
      h2 {
        font-size: 36px;
        margin: 20px 0 30px;
      }
      
      button {
        padding: 12px 30px;
        font-size: 18px;
      }
      h2 {
        font-size: 30px;
        margin: 15px 0 25px;
      }
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }

      h2 {
        font-size: 17px;
      }

      button {
        padding: 8px 20px;
        font-size: 13px;
      }
    }

    /* 💻 Large screens */
    @media (min-width: 768px) {
      .card {
        max-width: 460px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="floating-elements" id="floatingElements">
    <!-- Elements will be added by JavaScript -->
  </div>
  
  <script>
    const container = document.getElementById('floatingElements');
    const elementTypes = ['heart', 'rose', 'small-heart'];
    
    function createFloatingElement() {
      const element = document.createElement('div');
      const type = elementTypes[Math.floor(Math.random() * elementTypes.length)];
      
      element.className = `element ${type}`;
      
      if (type === 'heart' || type === 'small-heart') {
        element.innerHTML = '❤️';
      }
      
      // Random position and animation
      const startPos = Math.random() * 100;
      const duration = 10 + Math.random() * 20; // 10-30 seconds
      const delay = Math.random() * 5; // 0-5 seconds
      const size = 15 + Math.random() * 15; // 15-30px
      
      element.style.left = `${startPos}%`;
      element.style.animationDuration = `${duration}s`;
      element.style.animationDelay = `${delay}s`;
      element.style.fontSize = `${size}px`;
      
      container.appendChild(element);
      
      // Remove element after animation completes
      setTimeout(() => {
        element.remove();
      }, (duration + delay) * 1000);
    }
    
    // Create initial elements
    for (let i = 0; i < 15; i++) {
      setTimeout(createFloatingElement, i * 1000);
    }
    
    // Continue creating new elements
    setInterval(() => {
      if (container.children.length < 20) {
        createFloatingElement();
      }
    }, 1000);
  </script>
  <div class="card">
    <h2>Ridhi, will you be my valentine? 💝</h2>

    <div class="buttons">
      <button class="yes" id="yesBtn">Yes</button>
      <button class="no" id="noBtn">No</button>
    </div>

    <div class="note">*not gonna lie tho 😼*</div>
  </div>

  <style>
    .party {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #f00;
      opacity: 0.8;
      animation: confetti-fall 5s linear infinite;
    }
    
    @keyframes confetti-fall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    .emoji {
      position: absolute;
      font-size: 24px;
      animation: float-up 3s ease-out forwards;
    }
    
    .forced-message {
      color: #ff4d6d;
      font-size: 28px;
      font-family: 'Dancing Script', cursive;
      margin: 20px 0 10px;
      display: none;
      animation: fadeIn 1s ease-in;
      position: relative;
      z-index: 1001;
      line-height: 1.4;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <div class="party" id="party"></div>
  
  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const card = document.querySelector('.card');
    const partyContainer = document.getElementById('party');
    const emojis = ['🎉', '🎊', '🎈', '💖', '🥳', '✨', '🎁', '💝'];
    
    // Add click event for Yes button
    yesBtn.addEventListener('click', () => {
      startParty();
      document.querySelector('h2').textContent = 'YAY! Best decision ever! 🎉';
      document.querySelector('.note').style.display = 'none';
      noBtn.style.display = 'none';
      yesBtn.style.display = 'none';
      
      // Show forced message after a delay
      setTimeout(() => {
        const forcedMessage = document.createElement('div');
        forcedMessage.className = 'forced-message';
        forcedMessage.innerHTML = 'I knew you would say yes! <span style="font-family: \'Dancing Script\', cursive; font-size: 1.2em;">😍</span>';
        card.appendChild(forcedMessage);
        forcedMessage.style.display = 'block';
      }, 1000);
    });
    
    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
      confetti.style.width = (Math.random() * 10 + 5) + 'px';
      confetti.style.height = (Math.random() * 10 + 5) + 'px';
      partyContainer.appendChild(confetti);
      
      setTimeout(() => {
        confetti.remove();
      }, 5000);
    }
    
    function createEmoji() {
      const emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
      emoji.style.fontSize = (Math.random() * 20 + 20) + 'px';
      partyContainer.appendChild(emoji);
      
      setTimeout(() => {
        emoji.remove();
      }, 3000);
    }
    
    function startParty() {
      partyContainer.style.display = 'block';
      
      // Create initial confetti
      for (let i = 0; i < 50; i++) {
        setTimeout(createConfetti, i * 100);
      }
      
      // Create emojis
      setInterval(createEmoji, 300);
      
      // Keep adding confetti
      setInterval(createConfetti, 100);
      
      // Change background color
      document.body.style.animation = 'partyBg 2s infinite';
    }
    
    // Add party background animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes partyBg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    `;
    document.head.appendChild(style);
    const messages = [
      "No",
      "Really?",
      "Are you sure?",
      "Is this a prank?",
      "You woke up and chose this?",
      "Let me pretend I didn't hear that",
      "Bold of you to ask",
      "I admire the confidence",
      "Let's not do this today"
    ];
    let currentMessageIndex = 0;

    // Create forced message element
    const forcedMessage = document.createElement('div');
    forcedMessage.className = 'forced-message';
    forcedMessage.innerHTML = 'Tough luck! You\'re going to be my valentine! <span style="font-family: \'Dancing Script\', cursive; font-size: 1.2em;">❤️</span>';
    card.appendChild(forcedMessage);

    noBtn.addEventListener("click", () => {
      currentMessageIndex++;
      
      if (currentMessageIndex < messages.length) {
        noBtn.textContent = messages[currentMessageIndex];
        
        if (currentMessageIndex === messages.length - 1) {
          // On last message, hide the button and show forced message
          setTimeout(() => {
            noBtn.style.display = 'none';
            forcedMessage.style.display = 'block';
            
            // Also change the main heading
            const heading = document.querySelector('h2');
            heading.textContent = 'I knew you would say yes! 😍';
            heading.style.color = '#ff4d6d';
            
            // Hide the note at the bottom
            document.querySelector('.note').style.display = 'none';
          }, 800);
        }
      }
    });
  </script>
</body>
</html>
